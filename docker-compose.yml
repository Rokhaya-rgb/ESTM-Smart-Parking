# PARTIE VPS (temps réel) d'ESTM Smart Parking
#
#   ESP32 --MQTT:1883--> [mosquitto] --> [relais] --HTTPS POST /api/mqtt--> site sur le mutualisé --> base MySQL
#
# Ce fichier ne lance PAS le site : celui-ci est hébergé sur le mutualisé (voir DEPLOIEMENT.md).
#   mosquitto  broker MQTT, mot de passe obligatoire
#   relais     php artisan mqttlisten en mode relais : aucune base ici, il transmet chaque message au site
#
# Mise en route :
#   1. cp .env.vps.example .env   puis renseigner MQTT_PASSWORD, INGEST_API_KEY, MQTT_FORWARD_URL.
#   2. Fichier de mots de passe du broker :
#      docker run --rm -v "$PWD/docker/mosquitto:/mosquitto/config" eclipse-mosquitto:2 \
#        mosquitto_passwd -c -b /mosquitto/config/passwd parking_estm "<MQTT_PASSWORD>"
#   3. docker compose up -d --build

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  relais:
    build:
      context: .
      dockerfile: Dockerfile.mqtt
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto-data:
